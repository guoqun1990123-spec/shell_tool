  footnote2: 全分析集(FAS)包括所有随机化入组且至少接受过一次研究药物治疗的受试者。对于基于FAS的分析，受试者分组将以随机化分配的治疗为准。
  footnote3: 安全性分析集 (SS)包括所有随机化入组且至少接受过一次研究药物治疗的受试者。对于基于SS的分析，受试者分组将以实际接受治疗的分组为准。
  footnote4: 药代动力学浓度分析集（PKCS）包括至少使用一次试验组研究药物治疗且具有至少一个可评价PK浓度数据的所有受试者。
  footnote5: 免疫原性分析集（ADAS）包括至少接受一次试验组研究药物治疗，且具有用药前基线和至少一个用药后免疫原性评价数据的受试者。
