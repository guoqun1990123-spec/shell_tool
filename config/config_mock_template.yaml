- SeqNum: 11
  Section no: '14.1'
  Section title: 参与者特征
  cat: 表
  table no: 14.1.11.1
  title: 药物暴露与依从性汇总
  pop: SS
  MacVar: PStab
  Datasets: ex
  Trtlab: 试验组(N=xx)|对照组(N=xx)
  Subgrp: 替雷利珠单抗|苯达莫司汀|吉西他滨
  Adcols: ''
  Varlab: ''
  Labparm: ''
  footnote1: 替雷利珠单抗：暴露持续时间 (月)=(末次给药日期-首次给药日期 + 21)/ 30.4375；暴露持续周期(周期)= 暴露持续时间(天)/21；总累积剂量(mg)=
    受试者接受的替雷利珠单抗剂量(mg)之和；实际剂量强度(mg/3周)= 总累积剂量(mg)/ [ (末次给药日期-首次给药日期 + 21)/21]；相对剂量强度(%)=实际剂量强度/计划剂量强度*100%，其中计划剂量强度为200mg每3周
  footnote2: 注射用IMM01：暴露持续时间 (月)=(末次给药日期-首次给药日期 + 7)/ 30.4375;暴露持续周期(周期)=暴露持续时间(天)/21;总累积剂量(mg)=
    受试者接受的IMM01剂量(mg)之和;总校准累积剂量(mg/kg)= 总累积剂量(mg)/ 体重(kg);实际剂量强度(mg/kg/周)= 总校准累积剂量(mg/kg)
    /  (末次给药日期-首次给药日期 + 7)/7;相对剂量强度(%)=实际剂量强度/计划剂量强度*100%，其中计划剂量强度为2.0 mg/kg每周
  footnote3: 苯达莫司汀：暴露持续时间 (月)= (末次给药日期-首次给药日期 +28)/ 30.4375, 若末次给药为本周期的第1天给药；或(末次给药日期-首次给药日期
    +27)/ 30.4375，若末次给药为本周期的第2天给药. 暴露持续周期(周期)=暴露持续时间(天)/28;总累积剂量(mg)= 受试者接受的苯达莫司汀剂量(mg)之和;总校准累积剂量(mg/m2)=总累积剂量(mg)/BSA(m2),其中BSA(m2)
    = 0.0061×身高(cm) + 0.0124×体重(kg) - 0.0099.实际剂量强度(mg/m2/4周)= 总校准累积剂量(mg/m2)/ 暴露持续周期;相对剂量强度(%)=实际剂量强度/计划剂量强度*100%，其中计划剂量强度每次为90
    mg/m2或者120mg/m2，每4周为一个周期，具体结合受试者耐受程度和研究中心实践选择起始给药剂量。则一个周期的计划剂量强度为180 mg/m2/4周或者240mg/m2/4周
  footnote4: 吉西他滨：暴露持续时间 (月)= (末次给药日期-首次给药日期 +7   )/ 30.4375, 若末次给药为本周期的第1天给药；或(末次给药日期-首次给药日期
    +14)/ 30.4375，若末次给药为本周期的第8天给药.暴露持续周期(周期)= 暴露持续时间(天)/21;总累积剂量(mg)= 受试者接受的吉西他滨剂量(mg)之和;总校准累积剂量(mg/m2)=总累积剂量(mg)/BSA(m2),其中BSA(m2)
    = 0.0061×身高(cm) + 0.0124×体重(kg) - 0.0099.实际剂量强度(mg/m2/3周)= 总校准累积剂量(mg/m2)/暴露持续周期;相对剂量强度(%)=实际剂量强度/计划剂量强度*100%，其中计划剂量强度2000
    mg/m2每3周 （1000 mg/m2每3周为一个治疗周期，每个周期的第1天和第8天给药一次）
  footnote5: 依从性(%)=实际给药剂量(mg)之和/计划给药剂量(mg)之和
  footnote6: ''
  footnote7: ''
  PgmNotes: ''
  ByseqL: ''
  RefTFL: ''
  Dutoffdate: ''
  Source_Data: 列表 16.2.5.1, 16.2.5.2, 16.2.5.3, 16.2.5.4
