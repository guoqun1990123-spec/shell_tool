- SeqNum: 13
  Section no: '14.2'
  Section title: 疗效分析
  cat: 表
  table no: 14.2.2.1
  title: IRC基于2014 Lugano淋巴瘤疗效评价标准评估的无进展生存期（PFS）总结表
  pop: ITT
  MacVar: PStab
  Datasets: pfs
  Trtlab: 试验组(N=xx)|对照组(N=xx)
  Subgrp: ''
  Adcols: ''
  Varlab: ''
  Labparm: ''
  footnote1: 无进展生存期(PFS)定义为从随机化日期至首次IRC基于Lugano 2014 评效标准评价为疾病进展或任何原因导致死亡（以先发生者为准）日期之间的时间。PFS时间（月）计算为（首次PD或死亡/删失日期-随机化日期
    + 1）/30.4375。
  footnote2: 采用分层对数秩检验（stratified log-rank test），按照随机化的分层因素：包括是否接受过干细胞移植（是或否）和ECOG评分（0/1
    或2）（如适用），对PFS进行组间差异检验。
  footnote3: 使用分层Cox比例风险模型（使用Efron结点处理法），按照随机化的分层因素：包括是否接受过干细胞移植（是或否）和ECOG评分（0/1 或2）（如适用），估计风险比HR及其双侧95%CI。
  footnote4: 使用Kaplan-Meier（KM）方法估计各治疗组的中位时间，根据Brookmeyer和Crowley方法计算中位生存时间的95%CI。生存率的95%CI的计算基于Greenwood公式计算的标准误的Log-Log转换。
  footnote5: 风险比为试验组：对照组，风险比<1，说明IMM01联合替雷利珠单抗试验组优于苯达莫司汀或吉西他滨化疗对照组。
  footnote6: ''
  footnote7: ''
  PgmNotes: 'Programming Note: 对于DOR分析，Kaplan-Meier 统计量需额外报告最大值和最小值；敏感性分析的删失汇总项与主分析有区别。'
  ByseqL: ''
  RefTFL: ''
  Dutoffdate: ''
  Source_Data: 列表 16.2.6.9.1
